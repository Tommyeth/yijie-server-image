# One KataGo process owns one GPU and can search at most ten positions at once.
logDir = analysis_logs
reportAnalysisWinratesAs = SIDETOMOVE
warnUnusedFields = true

wideRootNoise = 0.0
maxTime = 5.0

numAnalysisThreads = 10
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 22
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true
numNNServerThreadsPerModel = 1

maxBoardXSizeForNNBuffer = 19
maxBoardYSizeForNNBuffer = 19
requireMaxBoardSize = false
